<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Georgia, 'Cormorant Garamond', 'Times New Roman', serif">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11"/>
      <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.30  0 0 0 0 0.22  0 0 0 0.07 0"/>
    </filter>
    <radialGradient id="paperWash" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#efe8d6"/>
      <stop offset="100%" stop-color="#e3dbc3"/>
    </radialGradient>

    <symbol id="growthMark" viewBox="-220 -220 440 440" overflow="visible">
      <circle r="190" stroke="#8a9d76" stroke-width="2.4" fill="none"/>
      <circle cx="80.3"  cy="-172.2" r="8.5" fill="#8a9d76"/>
      <circle cx="178.5" cy="65.0"   r="6"   fill="#8a9d76"/>
      <circle cx="-108.9" cy="155.6" r="8"   fill="#8a9d76"/>
      <circle cx="-172.2" cy="-80.3" r="5"   fill="#8a9d76"/>
      <path d="M 0 105 C -3 75 3 35 0 -5" stroke="#8a9d76" stroke-width="3.6" fill="none" stroke-linecap="round"/>
      <g transform="rotate(-32)">
        <path d="M 0 0 C 26 -18 26 -82 0 -100 C -26 -82 -26 -18 0 0 Z" fill="#8a9d76"/>
        <path d="M 0 -2 L 0 -96" stroke="#6f8462" stroke-width="0.8" fill="none" opacity="0.55"/>
      </g>
      <g transform="rotate(29)">
        <path d="M 0 0 C 30 -20 28 -94 0 -115 C -28 -94 -30 -20 0 0 Z" fill="#8a9d76"/>
        <path d="M 0 -2 L 0 -110" stroke="#6f8462" stroke-width="0.8" fill="none" opacity="0.55"/>
      </g>
    </symbol>
  </defs>

  <rect width="1400" height="900" fill="url(#paperWash)"/>
  <rect width="1400" height="900" filter="url(#grain)"/>

  <text x="80" y="105" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="3.5" fill="#4a4639">CONCEPT 1 — REFINED</text>
  <line x1="80" y1="122" x2="200" y2="122" stroke="#a59f8e" stroke-width="0.8"/>

  <text x="80" y="225" font-size="64" font-weight="400" fill="#2a2823">Growth Mark</text>

  <text x="80" y="305" font-size="17" font-style="italic" fill="#4a4740">A gentle mark for the days</text>
  <text x="80" y="330" font-size="17" font-style="italic" fill="#4a4740">that matter.</text>

  <text x="80" y="395" font-size="12" fill="#6a665a" font-style="italic" opacity="0.85">refinement notes:</text>
  <text x="80" y="418" font-size="11" fill="#6a665a">— 4 markers with varied weight, not 6</text>
  <text x="80" y="436" font-size="11" fill="#6a665a">— deliberate asymmetric placement</text>
  <text x="80" y="454" font-size="11" fill="#6a665a">— leaves no longer perfectly mirrored</text>
  <text x="80" y="472" font-size="11" fill="#6a665a">— faint center vein for handmade warmth</text>

  <use href="#growthMark" x="640" y="200" width="400" height="400"/>

  <g transform="translate(1290, 240)">
    <circle r="58" stroke="#7a7464" stroke-width="0.7" fill="none"/>
    <circle r="50" stroke="#7a7464" stroke-width="0.4" fill="none"/>
    <text y="-22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6.8" letter-spacing="1.5" fill="#4a4639">FOR THE MOMENTS</text>
    <text y="-10" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="6.8" letter-spacing="1.5" fill="#4a4639">THAT MATTER</text>
    <line x1="-22" y1="-3" x2="22" y2="-3" stroke="#7a7464" stroke-width="0.4"/>
    <text y="13" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2.5" fill="#2a2823">GROW</text>
    <text y="28" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2.5" fill="#2a2823">GENTLY</text>
    <line x1="-22" y1="35" x2="22" y2="35" stroke="#7a7464" stroke-width="0.4"/>
  </g>

  <g transform="translate(1295, 95)" opacity="0.4">
    <path d="M 0 0 Q 4 30 -2 60 Q -8 90 2 130" stroke="#7a7464" stroke-width="0.9" fill="none"/>
    <ellipse cx="-10" cy="15" rx="3" ry="9" fill="#7a7464" transform="rotate(-30 -10 15)"/>
    <ellipse cx="10"  cy="32" rx="3" ry="9" fill="#7a7464" transform="rotate(35 10 32)"/>
    <ellipse cx="-12" cy="52" rx="3" ry="9" fill="#7a7464" transform="rotate(-30 -12 52)"/>
    <ellipse cx="10"  cy="72" rx="3" ry="9" fill="#7a7464" transform="rotate(35 10 72)"/>
    <ellipse cx="-12" cy="93" rx="3" ry="9" fill="#7a7464" transform="rotate(-30 -12 93)"/>
  </g>

  <line x1="80" y1="660" x2="1320" y2="660" stroke="#b5af9c" stroke-width="0.5" stroke-dasharray="1 5"/>

  <text x="80" y="700" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#4a4639">APP ICON</text>
  <line x1="80" y1="713" x2="160" y2="713" stroke="#a59f8e" stroke-width="0.6"/>

  <g transform="translate(180, 740)">
    <rect width="140" height="140" rx="30" fill="#e2dac3" stroke="#b5af9c" stroke-width="0.6"/>
    <use href="#growthMark" x="14" y="14" width="112" height="112"/>
  </g>

  <text x="340" y="765" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2" fill="#6a665a">iOS / Android</text>
  <text x="340" y="785" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2" fill="#6a665a">home screen</text>
  <text x="340" y="810" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a4740">"sits quietly between</text>
  <text x="340" y="828" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#4a4740">your other apps."</text>

  <line x1="640" y1="690" x2="640" y2="870" stroke="#b5af9c" stroke-width="0.4" stroke-dasharray="1 4"/>

  <text x="720" y="700" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#4a4639">WORDMARK LOCKUP</text>
  <line x1="720" y1="713" x2="880" y2="713" stroke="#a59f8e" stroke-width="0.6"/>

  <g transform="translate(770, 810)">
    <use href="#growthMark" x="-55" y="-55" width="110" height="110"/>
    <text x="75" y="22" font-size="76" font-weight="400" fill="#2a2823">Verdant</text>
  </g>

  <text x="700" y="877" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="5" fill="#4a4639">PLANT  ·  REMEMBER  ·  GROW</text>

  <g transform="translate(700, 853)" opacity="0.45">
    <path d="M -16 0 Q 0 -4 16 0" stroke="#7a7464" stroke-width="0.6" fill="none"/>
    <circle r="1.3" fill="#7a7464"/>
  </g>
</svg>
