<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Verdant · 数据录入</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #faf8f4;
    --surface: #ffffff;
    --border: #e4dfd7;
    --accent: #6b8f6b;
    --accent-light: #e8f0e8;
    --text: #2d2d2d;
    --text-muted: #999;
    --danger: #c0392b;
    --radius: 12px;
  }

  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 16px;
  }

  /* ── Header ── */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .header-title { font-size: 15px; font-weight: 600; color: var(--accent); flex: 1; }
  .header-meta { font-size: 12px; color: var(--text-muted); }
  #saveStatus { font-size: 12px; color: var(--accent); min-width: 60px; text-align: right; }

  /* ── Plant tab bar ── */
  .plant-bar {
    position: sticky;
    top: 53px;
    z-index: 90;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 0;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .plant-bar::-webkit-scrollbar { display: none; }

  .plant-tab {
    flex-shrink: 0;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-muted);
    border: none;
    background: transparent;
    cursor: pointer;
    white-space: nowrap;
    border-bottom: 2.5px solid transparent;
    transition: all 0.15s;
  }
  .plant-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .plant-tab-add {
    flex-shrink: 0;
    padding: 10px 16px;
    font-size: 20px;
    color: var(--accent);
    border: none;
    background: transparent;
    cursor: pointer;
  }

  /* ── Page ── */
  .page { padding: 16px 16px 120px; max-width: 600px; margin: 0 auto; }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty .icon { font-size: 52px; margin-bottom: 16px; }
  .empty p { font-size: 15px; line-height: 1.6; }

  /* ── Section ── */
  .section {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    margin-bottom: 14px;
    overflow: hidden;
  }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 16px;
    border-bottom: 1px solid var(--border);
  }
  .section-head h2 { font-size: 14px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .section-body { padding: 16px; display: flex; flex-direction: column; gap: 16px; }

  /* ── Fields ── */
  .field { display: flex; flex-direction: column; gap: 7px; }
  label { font-size: 13px; font-weight: 500; color: var(--text-muted); }

  input[type="text"],
  input[type="date"],
  textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 16px; /* prevents iOS zoom */
    font-family: inherit;
    background: var(--surface);
    color: var(--text);
    outline: none;
    -webkit-appearance: none;
    transition: border-color 0.15s;
  }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: none; min-height: 80px; line-height: 1.5; }

  /* ── Cover photo ── */
  .cover-area { display: flex; align-items: center; gap: 14px; }
  .cover-box {
    width: 80px;
    height: 80px;
    border-radius: 12px;
    background: var(--bg);
    border: 2px dashed var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    cursor: pointer;
    overflow: hidden;
  }
  .cover-box img { width: 100%; height: 100%; object-fit: cover; }
  .cover-hint { font-size: 13px; color: var(--text-muted); line-height: 1.6; }

  /* ── Chips ── */
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 9px 16px;
    border-radius: 24px;
    font-size: 15px;
    border: 1.5px solid var(--border);
    cursor: pointer;
    background: var(--surface);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    transition: all 0.12s;
  }
  .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ── Record cards ── */
  .record-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
  }
  .record-card:last-child { margin-bottom: 0; }

  .record-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 16px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    background: var(--bg);
  }
  .record-head-left { display: flex; align-items: center; gap: 10px; }
  .record-date { font-size: 15px; font-weight: 600; }
  .record-summary { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .record-chevron { font-size: 12px; color: var(--text-muted); transition: transform 0.2s; }
  .record-chevron.open { transform: rotate(180deg); }

  .record-body {
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    border-top: 1px solid var(--border);
  }
  .record-body.collapsed { display: none; }

  /* ── Photos ── */
  .photo-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .photo-thumb {
    width: 80px; height: 80px;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    border: 1.5px solid var(--border);
    flex-shrink: 0;
  }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .photo-del {
    position: absolute; top: 3px; right: 3px;
    width: 22px; height: 22px;
    background: rgba(0,0,0,0.6);
    border: none; border-radius: 50%;
    color: #fff; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .photo-add {
    width: 80px; height: 80px;
    border-radius: 10px;
    border: 2px dashed var(--border);
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    color: var(--text-muted);
    cursor: pointer;
    flex-shrink: 0;
  }

  /* ── Buttons ── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 15px; font-weight: 500;
    border: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); opacity: 0.85; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-outline { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
  .btn-danger-text { background: transparent; color: var(--danger); border: none; font-size: 13px; padding: 6px 10px; }
  .btn-sm { padding: 7px 14px; font-size: 13px; border-radius: 8px; }
  .btn-full { width: 100%; }
  .btn-icon { padding: 8px; font-size: 18px; background: transparent; border: none; cursor: pointer; color: var(--text-muted); }

  /* ── Bottom bar ── */
  .bottom-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 100;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    max-width: 600px;
    margin: 0 auto;
  }
  /* Fix: bottom bar centering on wide screens */
  @media (min-width: 600px) {
    .bottom-bar { left: 50%; transform: translateX(-50%); right: auto; width: 600px; }
  }

  /* ── Toast ── */
  #toast {
    position: fixed; bottom: 80px; left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: #2d2d2d; color: #fff;
    padding: 10px 18px; border-radius: 8px;
    font-size: 14px; opacity: 0; pointer-events: none;
    transition: all 0.25s; z-index: 999; white-space: nowrap;
    max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  input[type="file"] { display: none; }

  .del-plant-row {
    padding: 0 16px 16px;
    display: flex;
    justify-content: center;
  }

  .records-empty {
    text-align: center;
    padding: 24px 0;
    color: var(--text-muted);
    font-size: 14px;
  }

  .tag {
    display: inline-block;
    padding: 2px 8px;
    background: var(--accent-light);
    color: var(--accent);
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
  }

  .progress-bar {
    display: none;
    position: fixed; top: 0; left: 0; right: 0;
    height: 3px; background: var(--accent-light); z-index: 200;
  }
  .progress-fill { height: 100%; background: var(--accent); transition: width 0.2s; }
</style>
</head>
<body>

<div class="progress-bar" id="progressBar">
  <div class="progress-fill" id="progressFill" style="width:0%"></div>
</div>

<!-- Header -->
<div class="header">
  <div class="header-title">🌿 植物数据录入</div>
  <span id="saveStatus"></span>
</div>

<!-- Plant tab bar -->
<div class="plant-bar" id="plantBar">
  <button class="plant-tab-add" onclick="addPlant()" title="新增植物">＋</button>
</div>

<!-- Main content -->
<div class="page" id="page">
  <div class="empty">
    <div class="icon">🪴</div>
    <p>点上方「＋」新增你的第一株植物</p>
  </div>
</div>

<!-- Bottom bar -->
<div class="bottom-bar">
  <button class="btn btn-outline btn-sm" onclick="clearLocal()" style="color:var(--text-muted);border-color:var(--border)">清空重来</button>
  <button class="btn btn-primary btn-full" onclick="exportData()">⬇ 导出 JSON 发给 Claude</button>
</div>

<div id="toast"></div>
<input type="file" id="coverInput" accept="image/*">
<input type="file" id="recordInput" accept="image/*" multiple>

<script>
// ══════════════════════════════════════
//  State
// ══════════════════════════════════════
let state = { plants: [], activePlantId: null };

// ══════════════════════════════════════
//  Models
// ══════════════════════════════════════
function makePlant() {
  return { id: uid(), name: '', nickname: '', startedOn: '', coverDataUrl: null, records: [] };
}
function makeRecord() {
  return { id: uid(), date: today(), actions: [], states: [], note: '', photos: [] };
}

// ══════════════════════════════════════
//  Helpers
// ══════════════════════════════════════
function uid() { return Math.random().toString(36).slice(2, 10); }
function today() { return new Date().toISOString().slice(0, 10); }
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function activePlant() { return state.plants.find(p => p.id === state.activePlantId) || null; }

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2800);
}

function compressImage(file, maxW = 900, quality = 0.78) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width: w, height: h } = img;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.src = url;
  });
}

const ACTIONS = [
  { value: 'water',       label: '💧 浇水' },
  { value: 'fertilize',   label: '🌱 施肥' },
  { value: 'repot',       label: '🪴 换盆' },
  { value: 'prune',       label: '✂️ 修剪' },
  { value: 'bringHome',   label: '🏠 带回家' },
  { value: 'sow',         label: '🌾 播种/扦插' },
];
const STATES = [
  { value: 'newLeaf',          label: '🌿 长新叶' },
  { value: 'blooming',         label: '🌸 开花了' },
  { value: 'lookingBeautiful', label: '✨ 状态很棒' },
  { value: 'sick',             label: '🥀 不太好' },
];

// ══════════════════════════════════════
//  Actions
// ══════════════════════════════════════
function addPlant() {
  const p = makePlant();
  state.plants.push(p);
  state.activePlantId = p.id;
  renderAll();
  // Scroll tab bar to end
  setTimeout(() => {
    const bar = document.getElementById('plantBar');
    bar.scrollLeft = bar.scrollWidth;
  }, 50);
}

function deletePlant(id) {
  if (!confirm('确认删除这株植物及所有记录？')) return;
  state.plants = state.plants.filter(p => p.id !== id);
  state.activePlantId = state.plants.length ? state.plants[state.plants.length - 1].id : null;
  renderAll();
}

function selectPlant(id) {
  state.activePlantId = id;
  renderAll();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updatePlant(field, value) {
  const p = activePlant();
  if (p) { p[field] = value; saveToLocal(); renderTabBar(); }
}

function addRecord() {
  const p = activePlant();
  if (!p) return;
  p.records.unshift(makeRecord());
  renderPage();
  // Scroll to top of page to see new record
  setTimeout(() => {
    const first = document.querySelector('.record-card');
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 50);
}

function deleteRecord(plantId, recordId) {
  if (!confirm('删除这条记录？')) return;
  const p = state.plants.find(p => p.id === plantId);
  if (p) { p.records = p.records.filter(r => r.id !== recordId); renderPage(); }
}

function toggleChip(plantId, recordId, field, value) {
  const p = state.plants.find(p => p.id === plantId);
  if (!p) return;
  const r = p.records.find(r => r.id === recordId);
  if (!r) return;
  const idx = r[field].indexOf(value);
  if (idx === -1) r[field].push(value); else r[field].splice(idx, 1);
  // Update chip appearance without full re-render
  document.querySelectorAll(`[data-chip="${plantId}-${recordId}-${field}-${value}"]`).forEach(el => {
    el.classList.toggle('on', r[field].includes(value));
  });
  saveToLocal();
}

function updateRecordDate(plantId, recordId, value) {
  const p = state.plants.find(p => p.id === plantId);
  if (!p) return;
  const r = p.records.find(r => r.id === recordId);
  if (r) { r.date = value; saveToLocal(); }
  // Update the record header date label without full re-render
  const el = document.getElementById(`rdate-${recordId}`);
  if (el) el.textContent = value || '未填日期';
}

function updateRecordNote(plantId, recordId, value) {
  const p = state.plants.find(p => p.id === plantId);
  if (!p) return;
  const r = p.records.find(r => r.id === recordId);
  if (r) { r.note = value; saveToLocal(); }
}

function toggleRecordBody(recordId) {
  const body = document.getElementById(`rbody-${recordId}`);
  const chevron = document.getElementById(`rchev-${recordId}`);
  if (!body) return;
  const isOpen = !body.classList.contains('collapsed');
  body.classList.toggle('collapsed', isOpen);
  if (chevron) chevron.classList.toggle('open', !isOpen);
}

function removeCover() {
  const p = activePlant();
  if (p) { p.coverDataUrl = null; renderPage(); }
}

function removePhoto(plantId, recordId, photoId) {
  const p = state.plants.find(p => p.id === plantId);
  if (!p) return;
  const r = p.records.find(r => r.id === recordId);
  if (r) { r.photos = r.photos.filter(ph => ph.id !== photoId); renderPage(); }
}

// ══════════════════════════════════════
//  File uploads
// ══════════════════════════════════════
let _coverTarget = null;
let _recordTarget = null;

document.getElementById('coverInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file || !_coverTarget) return;
  const p = state.plants.find(p => p.id === _coverTarget);
  if (!p) return;
  p.coverDataUrl = await compressImage(file, 600, 0.82);
  _coverTarget = null; e.target.value = '';
  renderAll();
  toast('封面照片已更新');
});

document.getElementById('recordInput').addEventListener('change', async (e) => {
  if (!_recordTarget) return;
  const { plantId, recordId } = _recordTarget;
  const files = Array.from(e.target.files);
  const p = state.plants.find(p => p.id === plantId);
  if (!p) return;
  const r = p.records.find(r => r.id === recordId);
  if (!r) return;
  for (const file of files) {
    r.photos.push({ id: uid(), dataUrl: await compressImage(file, 900, 0.78) });
  }
  _recordTarget = null; e.target.value = '';
  renderPage();
  toast(`已添加 ${files.length} 张照片`);
});

function triggerCoverUpload(plantId) {
  _coverTarget = plantId;
  document.getElementById('coverInput').click();
}
function triggerRecordPhoto(plantId, recordId) {
  _recordTarget = { plantId, recordId };
  document.getElementById('recordInput').click();
}

// ══════════════════════════════════════
//  Render
// ══════════════════════════════════════
function renderAll() {
  renderTabBar();
  renderPage();
  saveToLocal();
}

function renderTabBar() {
  const bar = document.getElementById('plantBar');
  const tabs = state.plants.map(p => `
    <button class="plant-tab ${p.id === state.activePlantId ? 'active' : ''}"
      onclick="selectPlant('${p.id}')">
      ${esc(p.name) || '未命名'}
    </button>
  `).join('');
  bar.innerHTML = tabs + `<button class="plant-tab-add" onclick="addPlant()" title="新增植物">＋</button>`;
}

function renderPage() {
  const page = document.getElementById('page');
  const p = activePlant();

  if (!p) {
    page.innerHTML = `<div class="empty">
      <div class="icon">🪴</div>
      <p>点上方「＋」新增你的第一株植物</p>
    </div>`;
    return;
  }

  page.innerHTML = `

    <!-- Basic info -->
    <div class="section">
      <div class="section-head"><h2>基本信息</h2></div>
      <div class="section-body">

        <div class="field">
          <label>植物名称 <span style="color:#c0392b">*</span></label>
          <input type="text" value="${esc(p.name)}" placeholder="例如：橡皮树、郁金香"
            oninput="updatePlant('name', this.value)" autocomplete="off">
        </div>

        <div class="field">
          <label>昵称（可选）</label>
          <input type="text" value="${esc(p.nickname)}" placeholder="例如：胖墩、小绿"
            oninput="updatePlant('nickname', this.value)" autocomplete="off">
        </div>

        <div class="field">
          <label>开始养护日期 <span style="color:#c0392b">*</span></label>
          <input type="date" value="${esc(p.startedOn)}"
            onchange="updatePlant('startedOn', this.value)">
        </div>

        <div class="field">
          <label>封面照片（主页卡片显示）</label>
          <div class="cover-area">
            <div class="cover-box" onclick="triggerCoverUpload('${p.id}')">
              ${p.coverDataUrl ? `<img src="${p.coverDataUrl}" alt="">` : '＋'}
            </div>
            <div class="cover-hint">
              点击上传封面<br>
              <span style="font-size:12px">建议竖版，展示植物全貌</span>
              ${p.coverDataUrl ? `<br><button class="btn-danger-text" style="margin-top:4px;padding:4px 0" onclick="removeCover()">移除封面</button>` : ''}
            </div>
          </div>
        </div>

      </div>
      <div class="del-plant-row">
        <button class="btn-danger-text" onclick="deletePlant('${p.id}')">🗑 删除这株植物</button>
      </div>
    </div>

    <!-- Records -->
    <div class="section">
      <div class="section-head">
        <h2>养护记录 <span class="tag">${p.records.length}</span></h2>
        <button class="btn btn-outline btn-sm" onclick="addRecord()">＋ 新增记录</button>
      </div>
      <div style="padding: ${p.records.length ? '12px' : '0'} 12px 12px">
        ${p.records.length === 0
          ? `<div class="records-empty">还没有记录<br>点「新增记录」添加</div>`
          : p.records.map(r => renderRecord(p.id, r)).join('')
        }
      </div>
    </div>

    <button class="btn btn-outline btn-full" onclick="addRecord()" style="margin-bottom: 8px">
      ＋ 继续添加记录
    </button>
  `;
}

function renderRecord(plantId, r) {
  const aLabels = r.actions.map(a => ACTIONS.find(x=>x.value===a)?.label).filter(Boolean).join(' ');
  const sLabels = r.states.map(s => STATES.find(x=>x.value===s)?.label).filter(Boolean).join(' ');
  const summary = [aLabels, sLabels].filter(Boolean).join(' · ') || '点击展开填写';

  return `
  <div class="record-card">
    <div class="record-head" onclick="toggleRecordBody('${r.id}')">
      <div class="record-head-left">
        <div>
          <div class="record-date" id="rdate-${r.id}">${r.date || '未填日期'}</div>
          <div class="record-summary">${esc(summary)}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        ${r.photos.length ? `<span class="tag">📷${r.photos.length}</span>` : ''}
        <span class="record-chevron open" id="rchev-${r.id}">▼</span>
      </div>
    </div>

    <div class="record-body" id="rbody-${r.id}">

      <div class="field">
        <label>记录日期</label>
        <input type="date" value="${esc(r.date)}"
          onchange="updateRecordDate('${plantId}','${r.id}',this.value)">
      </div>

      <div class="field">
        <label>做了什么（可多选）</label>
        <div class="chip-row">
          ${ACTIONS.map(a => `
            <div class="chip ${r.actions.includes(a.value) ? 'on' : ''}"
              data-chip="${plantId}-${r.id}-actions-${a.value}"
              onclick="toggleChip('${plantId}','${r.id}','actions','${a.value}')">
              ${a.label}
            </div>
          `).join('')}
        </div>
      </div>

      <div class="field">
        <label>植物状态（可多选）</label>
        <div class="chip-row">
          ${STATES.map(s => `
            <div class="chip ${r.states.includes(s.value) ? 'on' : ''}"
              data-chip="${plantId}-${r.id}-states-${s.value}"
              onclick="toggleChip('${plantId}','${r.id}','states','${s.value}')">
              ${s.label}
            </div>
          `).join('')}
        </div>
      </div>

      <div class="field">
        <label>备注（可选）</label>
        <textarea placeholder="记录一下当时的状态或心情…"
          onchange="updateRecordNote('${plantId}','${r.id}',this.value)"
          onblur="updateRecordNote('${plantId}','${r.id}',this.value)"
        >${esc(r.note)}</textarea>
      </div>

      <div class="field">
        <label>本次照片（可选）</label>
        <div class="photo-row">
          ${r.photos.map(ph => `
            <div class="photo-thumb">
              <img src="${ph.dataUrl}" alt="">
              <button class="photo-del" onclick="removePhoto('${plantId}','${r.id}','${ph.id}')">✕</button>
            </div>
          `).join('')}
          <div class="photo-add" onclick="triggerRecordPhoto('${plantId}','${r.id}')">＋</div>
        </div>
      </div>

      <div style="display:flex;justify-content:flex-end">
        <button class="btn-danger-text" onclick="deleteRecord('${plantId}','${r.id}')">🗑 删除此记录</button>
      </div>

    </div>
  </div>`;
}

// ══════════════════════════════════════
//  Export
// ══════════════════════════════════════
function exportData() {
  const errors = [];
  state.plants.forEach((p, i) => {
    if (!p.name.trim()) errors.push(`第 ${i+1} 株植物缺少名称`);
    if (!p.startedOn) errors.push(`「${p.name || '未命名'}」缺少开始养护日期`);
  });
  if (errors.length) { alert('请先修正：\n\n' + errors.join('\n')); return; }
  if (!state.plants.length) { alert('还没有植物数据，请先录入。'); return; }

  const payload = {
    version: 1,
    exportedAt: new Date().toISOString(),
    plants: state.plants.map(p => ({
      name: p.name.trim(),
      nickname: p.nickname.trim() || undefined,
      startedOn: p.startedOn,
      coverDataUrl: p.coverDataUrl || undefined,
      records: [...p.records]
        .sort((a, b) => a.date.localeCompare(b.date))
        .map(r => ({
          date: r.date,
          actions: r.actions,
          states: r.states,
          note: r.note.trim() || undefined,
          photos: r.photos.map(ph => ({ dataUrl: ph.dataUrl })),
        })),
    })),
  };

  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `verdant-demo-data-${today()}.json`;
  a.click(); URL.revokeObjectURL(url);

  const photos = state.plants.reduce((s, p) =>
    s + (p.coverDataUrl ? 1 : 0) + p.records.reduce((rs, r) => rs + r.photos.length, 0), 0);
  toast(`✅ 已导出！${state.plants.length} 株植物 · ${photos} 张照片`);
}

// ══════════════════════════════════════
//  Auto-save — IndexedDB（容量远大于 localStorage）
// ══════════════════════════════════════
const DB_NAME = 'verdant-builder';
const DB_STORE = 'state';
const DB_KEY = 'current';
// Legacy localStorage keys (for one-time migration only)
const LS_KEYS = ['verdant-demo-builder-v2', 'verdant-demo-builder-v1'];

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e) => e.target.result.createObjectStore(DB_STORE);
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

async function saveToLocal() {
  try {
    const db = await openDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put(state, DB_KEY);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    const el = document.getElementById('saveStatus');
    if (el) {
      el.textContent = '已保存 ✓';
      clearTimeout(saveToLocal._t);
      saveToLocal._t = setTimeout(() => { el.textContent = ''; }, 2500);
    }
  } catch(e) {
    console.error('Save failed:', e);
    const el = document.getElementById('saveStatus');
    if (el) el.textContent = '⚠️ 保存失败';
  }
}

async function loadFromLocal() {
  try {
    // 1. Try IndexedDB first
    const db = await openDB();
    const saved = await new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readonly');
      const req = tx.objectStore(DB_STORE).get(DB_KEY);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    if (saved && Array.isArray(saved.plants) && saved.plants.length > 0) {
      state = saved;
      return true;
    }

    // 2. Migrate from old localStorage if IndexedDB is empty
    for (const key of LS_KEYS) {
      const raw = localStorage.getItem(key);
      if (!raw) continue;
      const legacy = JSON.parse(raw);
      if (legacy && Array.isArray(legacy.plants) && legacy.plants.length > 0) {
        state = legacy;
        // Migrate to IndexedDB and clean up localStorage
        await saveToLocal();
        LS_KEYS.forEach(k => localStorage.removeItem(k));
        return true;
      }
    }
  } catch(e) {
    console.error('Load failed:', e);
  }
  return false;
}

async function clearLocal() {
  if (!confirm('确认清空所有数据？此操作不可撤销。')) return;
  try {
    const db = await openDB();
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).clear();
  } catch(e) {}
  LS_KEYS.forEach(k => localStorage.removeItem(k));
  state = { plants: [], activePlantId: null };
  renderAll();
  toast('已清空');
}

// ══════════════════════════════════════
//  Init
// ══════════════════════════════════════
async function init() {
  const hadData = await loadFromLocal();
  renderAll();
  if (hadData) {
    setTimeout(() => toast(`✅ 已恢复上次进度：${state.plants.length} 株植物`), 300);
  }
}
init();
</script>
