<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verdant · Demo 数据录入工具</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #faf8f4;
    --surface: #ffffff;
    --border: #e8e4dd;
    --accent: #6b8f6b;
    --accent-light: #e8f0e8;
    --text: #2d2d2d;
    --text-muted: #888;
    --danger: #c0392b;
    --radius: 10px;
    --shadow: 0 2px 8px rgba(0,0,0,0.07);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow);
  }
  header h1 { font-size: 18px; font-weight: 600; color: var(--accent); }
  header p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { opacity: 0.88; }
  .btn-outline {
    background: transparent;
    color: var(--accent);
    border: 1.5px solid var(--accent);
  }
  .btn-outline:hover { background: var(--accent-light); }
  .btn-danger { background: transparent; color: var(--danger); border: 1.5px solid var(--danger); }
  .btn-danger:hover { background: #fdf0ef; }
  .btn-sm { padding: 5px 12px; font-size: 13px; }

  /* ── Layout ── */
  .layout {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 16px 12px;
    gap: 8px;
    overflow-y: auto;
  }
  .sidebar-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 0 4px;
    margin-bottom: 4px;
  }
  .plant-tab {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.1s;
    border: none;
    background: transparent;
    width: 100%;
    text-align: left;
  }
  .plant-tab:hover { background: var(--bg); }
  .plant-tab.active { background: var(--accent-light); }
  .plant-thumb {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: var(--bg);
    overflow: hidden;
    flex-shrink: 0;
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }
  .plant-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .plant-tab-info { flex: 1; min-width: 0; }
  .plant-tab-name { font-size: 14px; font-weight: 500; truncate; }
  .plant-tab-meta { font-size: 12px; color: var(--text-muted); }

  /* ── Main ── */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 60vh;
    color: var(--text-muted);
    gap: 12px;
    text-align: center;
  }
  .empty-state .icon { font-size: 48px; }
  .empty-state p { font-size: 15px; }

  /* ── Plant Form ── */
  .plant-form { max-width: 720px; }

  .section {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    margin-bottom: 20px;
    overflow: hidden;
  }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .section-header h2 { font-size: 14px; font-weight: 600; }
  .section-body { padding: 18px; }

  .form-row { display: flex; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; flex: 1; margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  label { font-size: 13px; font-weight: 500; color: var(--text-muted); }

  input[type="text"],
  input[type="date"],
  textarea {
    padding: 9px 12px;
    border: 1.5px solid var(--border);
    border-radius: 7px;
    font-size: 14px;
    font-family: inherit;
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 72px; }

  /* ── Cover photo ── */
  .cover-upload {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .cover-preview {
    width: 80px;
    height: 80px;
    border-radius: 10px;
    background: var(--bg);
    border: 1.5px dashed var(--border);
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    cursor: pointer;
  }
  .cover-preview img { width: 100%; height: 100%; object-fit: cover; }
  .cover-upload-hint { font-size: 13px; color: var(--text-muted); line-height: 1.5; }

  /* ── Records ── */
  .record-card {
    border: 1.5px solid var(--border);
    border-radius: 9px;
    margin-bottom: 14px;
    overflow: hidden;
    background: var(--surface);
  }
  .record-card:last-child { margin-bottom: 0; }
  .record-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--bg);
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid var(--border);
  }
  .record-header-left { display: flex; align-items: center; gap: 10px; }
  .record-date { font-size: 13px; font-weight: 600; }
  .record-summary { font-size: 12px; color: var(--text-muted); }
  .record-body { padding: 14px; }

  .chip-group { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 6px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 11px;
    border-radius: 20px;
    font-size: 13px;
    border: 1.5px solid var(--border);
    cursor: pointer;
    transition: all 0.12s;
    background: var(--surface);
    color: var(--text);
    user-select: none;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.selected { background: var(--accent); color: #fff; border-color: var(--accent); }

  .photo-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .photo-thumb {
    width: 72px;
    height: 72px;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    border: 1.5px solid var(--border);
    cursor: pointer;
  }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .photo-thumb .remove-photo {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 18px;
    height: 18px;
    background: rgba(0,0,0,0.55);
    border-radius: 50%;
    border: none;
    color: #fff;
    font-size: 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .photo-add {
    width: 72px;
    height: 72px;
    border-radius: 8px;
    border: 1.5px dashed var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: var(--text-muted);
    cursor: pointer;
    background: var(--bg);
    transition: border-color 0.15s;
  }
  .photo-add:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #2d2d2d;
    color: #fff;
    padding: 11px 20px;
    border-radius: 8px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    z-index: 999;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Progress ── */
  .progress-bar {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent-light);
    z-index: 200;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.2s;
  }

  .divider { height: 1px; background: var(--border); margin: 14px 0; }

  input[type="file"] { display: none; }

  .tag {
    display: inline-block;
    padding: 2px 8px;
    background: var(--accent-light);
    color: var(--accent);
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
  }

  .stats-bar {
    display: flex;
    gap: 20px;
    padding: 12px 18px;
    background: var(--accent-light);
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--accent);
  }
  .stats-bar strong { font-weight: 600; }
</style>
</head>
<body>

<div class="progress-bar" id="progressBar">
  <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
</div>

<header>
  <div>
    <h1>🌿 Verdant Demo 数据录入工具</h1>
    <p>填写你的真实植物数据，导出 JSON 后发给 Claude 生成正式 demo</p>
  </div>
  <div style="display:flex;gap:10px;align-items:center;">
    <span id="saveStatus" style="font-size:12px;color:var(--accent);opacity:0;transition:opacity 0.4s"></span>
    <span id="statsLabel" style="font-size:13px;color:var(--text-muted)"></span>
    <button class="btn btn-outline btn-sm" onclick="clearLocal()" style="color:var(--text-muted);border-color:var(--border)">清空重来</button>
    <button class="btn btn-outline" onclick="addPlant()">＋ 新增植物</button>
    <button class="btn btn-primary" onclick="exportData()">⬇ 导出 JSON</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-title">我的植物</div>
    <div id="plantList"></div>
  </aside>
  <main class="main" id="mainArea">
    <div class="empty-state">
      <div class="icon">🪴</div>
      <p>点击左上角「新增植物」开始录入</p>
      <p style="font-size:13px">填完所有植物后点「导出 JSON」发给 Claude</p>
    </div>
  </main>
</div>

<div id="toast"></div>

<!-- Hidden file inputs -->
<input type="file" id="coverFileInput" accept="image/*">
<input type="file" id="recordFileInput" accept="image/*" multiple>

<script>
// ══════════════════════════════════════════════════
//  State
// ══════════════════════════════════════════════════

let state = {
  plants: [],      // Plant[]
  activePlantId: null,
};

// ══════════════════════════════════════════════════
//  Models
// ══════════════════════════════════════════════════

function makePlant() {
  return {
    id: uid(),
    name: '',
    nickname: '',
    startedOn: '',
    coverDataUrl: null,   // base64
    records: [],
  };
}

function makeRecord() {
  return {
    id: uid(),
    date: today(),
    actions: [],
    states: [],
    note: '',
    photos: [],   // [{id, dataUrl}]
  };
}

// ══════════════════════════════════════════════════
//  Helpers
// ══════════════════════════════════════════════════

function uid() { return Math.random().toString(36).slice(2, 10); }
function today() { return new Date().toISOString().slice(0, 10); }

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2800);
}

function activePlant() {
  return state.plants.find(p => p.id === state.activePlantId) || null;
}

function compressImage(file, maxW = 900, quality = 0.78) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width: w, height: h } = img;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.src = url;
  });
}

// ══════════════════════════════════════════════════
//  Actions
// ══════════════════════════════════════════════════

function addPlant() {
  const p = makePlant();
  state.plants.push(p);
  state.activePlantId = p.id;
  renderAll();
}

function deletePlant(id) {
  if (!confirm('确认删除这株植物及所有记录？')) return;
  state.plants = state.plants.filter(p => p.id !== id);
  if (state.activePlantId === id) {
    state.activePlantId = state.plants.length ? state.plants[state.plants.length - 1].id : null;
  }
  renderAll();
}

function selectPlant(id) {
  state.activePlantId = id;
  renderAll();
}

function updatePlantField(plantId, field, value) {
  const p = state.plants.find(p => p.id === plantId);
  if (p) p[field] = value;
  renderSidebar();
  updateStats();
}

function addRecord(plantId) {
  const p = state.plants.find(p => p.id === plantId);
  if (!p) return;
  p.records.unshift(makeRecord());
  renderMain();
}

function deleteRecord(plantId, recordId) {
  const p = state.plants.find(p => p.id === plantId);
  if (!p) return;
  p.records = p.records.filter(r => r.id !== recordId);
  renderMain();
}

function toggleChip(plantId, recordId, field, value) {
  const p = state.plants.find(p => p.id === plantId);
  if (!p) return;
  const r = p.records.find(r => r.id === recordId);
  if (!r) return;
  const idx = r[field].indexOf(value);
  if (idx === -1) r[field].push(value);
  else r[field].splice(idx, 1);
  renderMain();
}

function updateRecordField(plantId, recordId, field, value) {
  const p = state.plants.find(p => p.id === plantId);
  if (!p) return;
  const r = p.records.find(r => r.id === recordId);
  if (r) r[field] = value;
  // Don't re-render fully for text fields to avoid cursor jumping
  if (field === 'date') renderMain();
}

function removePhoto(plantId, recordId, photoId) {
  const p = state.plants.find(p => p.id === plantId);
  if (!p) return;
  const r = p.records.find(r => r.id === recordId);
  if (!r) return;
  r.photos = r.photos.filter(ph => ph.id !== photoId);
  renderMain();
}

// ══════════════════════════════════════════════════
//  File upload helpers
// ══════════════════════════════════════════════════

let _coverTarget = null;
let _recordTarget = null;

document.getElementById('coverFileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file || !_coverTarget) return;
  const dataUrl = await compressImage(file, 600, 0.82);
  const p = state.plants.find(p => p.id === _coverTarget);
  if (p) p.coverDataUrl = dataUrl;
  _coverTarget = null;
  e.target.value = '';
  renderAll();
});

document.getElementById('recordFileInput').addEventListener('change', async (e) => {
  if (!_recordTarget) return;
  const { plantId, recordId } = _recordTarget;
  const files = Array.from(e.target.files);
  const p = state.plants.find(p => p.id === plantId);
  if (!p) return;
  const r = p.records.find(r => r.id === recordId);
  if (!r) return;

  for (const file of files) {
    const dataUrl = await compressImage(file, 900, 0.78);
    r.photos.push({ id: uid(), dataUrl });
  }
  _recordTarget = null;
  e.target.value = '';
  renderMain();
  toast(`已添加 ${files.length} 张照片`);
});

function triggerCoverUpload(plantId) {
  _coverTarget = plantId;
  document.getElementById('coverFileInput').click();
}

function triggerRecordPhotoUpload(plantId, recordId) {
  _recordTarget = { plantId, recordId };
  document.getElementById('recordFileInput').click();
}

// ══════════════════════════════════════════════════
//  Render
// ══════════════════════════════════════════════════

const ACTIONS = [
  { value: 'water',     label: '💧 浇水' },
  { value: 'fertilize', label: '🌱 施肥' },
  { value: 'repot',     label: '🪴 换盆' },
  { value: 'prune',     label: '✂️ 修剪' },
  { value: 'bringHome', label: '🏠 带回家' },
];
const STATES = [
  { value: 'newLeaf',        label: '🌿 长新叶' },
  { value: 'blooming',       label: '🌸 开花了' },
  { value: 'lookingBeautiful', label: '✨ 状态很棒' },
  { value: 'sick',           label: '🥀 不太好' },
];

function renderAll() {
  renderSidebar();
  renderMain();
  updateStats();
}

function updateStats() {
  const totalRecords = state.plants.reduce((s, p) => s + p.records.length, 0);
  const totalPhotos = state.plants.reduce((s, p) => {
    const recPhotos = p.records.reduce((rs, r) => rs + r.photos.length, 0);
    return s + recPhotos + (p.coverDataUrl ? 1 : 0);
  }, 0);
  const el = document.getElementById('statsLabel');
  if (state.plants.length === 0) { el.textContent = ''; return; }
  el.textContent = `${state.plants.length} 株植物 · ${totalRecords} 条记录 · ${totalPhotos} 张照片`;
}

function renderSidebar() {
  const el = document.getElementById('plantList');
  if (state.plants.length === 0) {
    el.innerHTML = '<p style="font-size:13px;color:var(--text-muted);padding:8px 4px;">还没有植物</p>';
    return;
  }
  el.innerHTML = state.plants.map(p => `
    <button class="plant-tab ${p.id === state.activePlantId ? 'active' : ''}" onclick="selectPlant('${p.id}')">
      <div class="plant-thumb">
        ${p.coverDataUrl ? `<img src="${p.coverDataUrl}" alt="">` : '🌿'}
      </div>
      <div class="plant-tab-info">
        <div class="plant-tab-name">${e(p.name) || '<span style="color:var(--text-muted)">未命名</span>'}</div>
        <div class="plant-tab-meta">${p.records.length} 条记录</div>
      </div>
    </button>
  `).join('');
}

function renderMain() {
  const mainEl = document.getElementById('mainArea');
  const p = activePlant();

  if (!p) {
    mainEl.innerHTML = `<div class="empty-state">
      <div class="icon">🪴</div>
      <p>点击左上角「新增植物」开始录入</p>
      <p style="font-size:13px">填完所有植物后点「导出 JSON」发给 Claude</p>
    </div>`;
    return;
  }

  mainEl.innerHTML = `
  <div class="plant-form">

    <!-- Basic info -->
    <div class="section">
      <div class="section-header">
        <h2>基本信息</h2>
        <button class="btn btn-danger btn-sm" onclick="deletePlant('${p.id}')">删除这株植物</button>
      </div>
      <div class="section-body">
        <div class="form-row">
          <div class="field">
            <label>植物名称 <span style="color:#c0392b">*</span></label>
            <input type="text" value="${e(p.name)}" placeholder="例如：橡皮树"
              oninput="updatePlantField('${p.id}', 'name', this.value)">
          </div>
          <div class="field">
            <label>昵称（可选）</label>
            <input type="text" value="${e(p.nickname)}" placeholder="例如：胖墩"
              oninput="updatePlantField('${p.id}', 'nickname', this.value)">
          </div>
        </div>
        <div class="field">
          <label>开始养护的日期 <span style="color:#c0392b">*</span></label>
          <input type="date" value="${e(p.startedOn)}"
            onchange="updatePlantField('${p.id}', 'startedOn', this.value)"
            style="max-width:200px">
        </div>
        <div class="field">
          <label>封面照片（会显示在主页卡片上）</label>
          <div class="cover-upload">
            <div class="cover-preview" onclick="triggerCoverUpload('${p.id}')">
              ${p.coverDataUrl ? `<img src="${p.coverDataUrl}" alt="">` : '＋'}
            </div>
            <div class="cover-upload-hint">
              点击上传封面照片<br>
              <span style="font-size:12px">建议竖版照片，清晰展示植物全貌</span>
              ${p.coverDataUrl ? `<br><button class="btn btn-danger btn-sm" style="margin-top:6px" onclick="removeCover('${p.id}')">移除封面</button>` : ''}
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Records -->
    <div class="section">
      <div class="section-header">
        <h2>养护记录 <span class="tag">${p.records.length} 条</span></h2>
        <button class="btn btn-outline btn-sm" onclick="addRecord('${p.id}')">＋ 新增记录</button>
      </div>
      <div class="section-body" id="recordsBody-${p.id}">
        ${p.records.length === 0
          ? `<p style="color:var(--text-muted);font-size:14px;text-align:center;padding:20px 0">
              还没有记录。点「新增记录」添加每次的养护、观察。
            </p>`
          : p.records.map(r => renderRecordCard(p.id, r)).join('')
        }
      </div>
    </div>

    <div style="text-align:right;padding-bottom:40px">
      <button class="btn btn-outline" onclick="addRecord('${p.id}')">＋ 继续添加记录</button>
    </div>

  </div>`;
}

function renderRecordCard(plantId, r) {
  const actionLabels = r.actions.map(a => ACTIONS.find(x => x.value === a)?.label).filter(Boolean).join(' ');
  const stateLabels = r.states.map(s => STATES.find(x => x.value === s)?.label).filter(Boolean).join(' ');
  const summary = [actionLabels, stateLabels].filter(Boolean).join(' · ') || '点击展开填写';

  return `
  <div class="record-card">
    <div class="record-header" onclick="toggleRecord('rec-body-${r.id}')">
      <div class="record-header-left">
        <span style="font-size:16px">📋</span>
        <div>
          <div class="record-date">${r.date || '未填日期'}</div>
          <div class="record-summary">${summary}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        ${r.photos.length > 0 ? `<span class="tag">📷 ${r.photos.length}</span>` : ''}
        <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteRecord('${plantId}','${r.id}')">删除</button>
      </div>
    </div>
    <div class="record-body" id="rec-body-${r.id}">
      <div class="field">
        <label>记录日期</label>
        <input type="date" value="${e(r.date)}"
          onchange="updateRecordField('${plantId}','${r.id}','date',this.value)"
          style="max-width:180px">
      </div>

      <div class="field">
        <label>做了什么（可多选）</label>
        <div class="chip-group">
          ${ACTIONS.map(a => `
            <div class="chip ${r.actions.includes(a.value) ? 'selected' : ''}"
              onclick="toggleChip('${plantId}','${r.id}','actions','${a.value}')">
              ${a.label}
            </div>
          `).join('')}
        </div>
      </div>

      <div class="field">
        <label>植物状态（可多选）</label>
        <div class="chip-group">
          ${STATES.map(s => `
            <div class="chip ${r.states.includes(s.value) ? 'selected' : ''}"
              onclick="toggleChip('${plantId}','${r.id}','states','${s.value}')">
              ${s.label}
            </div>
          `).join('')}
        </div>
      </div>

      <div class="field">
        <label>备注（可选）</label>
        <textarea placeholder="这次浇水时发现叶子更舒展了，很开心…"
          onchange="updateRecordField('${plantId}','${r.id}','note',this.value)"
        >${e(r.note)}</textarea>
      </div>

      <div class="field">
        <label>本次照片（可选，可多张）</label>
        <div class="photo-grid">
          ${r.photos.map(ph => `
            <div class="photo-thumb">
              <img src="${ph.dataUrl}" alt="">
              <button class="remove-photo" onclick="removePhoto('${plantId}','${r.id}','${ph.id}')">✕</button>
            </div>
          `).join('')}
          <div class="photo-add" onclick="triggerRecordPhotoUpload('${plantId}','${r.id}')">＋</div>
        </div>
      </div>
    </div>
  </div>`;
}

function toggleRecord(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.style.display = el.style.display === 'none' ? '' : 'none';
}

function removeCover(plantId) {
  const p = state.plants.find(p => p.id === plantId);
  if (p) p.coverDataUrl = null;
  renderMain();
}

// XSS-safe escape
function e(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ══════════════════════════════════════════════════
//  Export
// ══════════════════════════════════════════════════

function exportData() {
  // Validate
  const errors = [];
  state.plants.forEach((p, i) => {
    if (!p.name.trim()) errors.push(`第 ${i+1} 株植物缺少名称`);
    if (!p.startedOn) errors.push(`「${p.name || '未命名'}」缺少开始养护日期`);
  });
  if (errors.length) {
    alert('请先修正以下问题：\n\n' + errors.join('\n'));
    return;
  }
  if (state.plants.length === 0) {
    alert('还没有植物数据，请先录入。');
    return;
  }

  const payload = {
    version: 1,
    exportedAt: new Date().toISOString(),
    plants: state.plants.map(p => ({
      name: p.name.trim(),
      nickname: p.nickname.trim() || undefined,
      startedOn: p.startedOn,
      coverDataUrl: p.coverDataUrl || undefined,
      records: [...p.records]
        .sort((a, b) => a.date.localeCompare(b.date))
        .map(r => ({
          date: r.date,
          actions: r.actions,
          states: r.states,
          note: r.note.trim() || undefined,
          photos: r.photos.map(ph => ({ dataUrl: ph.dataUrl })),
        })),
    })),
  };

  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `verdant-demo-data-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);

  const totalPhotos = state.plants.reduce((s, p) => {
    return s + (p.coverDataUrl ? 1 : 0) + p.records.reduce((rs, r) => rs + r.photos.length, 0);
  }, 0);
  toast(`✅ 已导出！${state.plants.length} 株植物，${totalPhotos} 张照片`);
}

// ══════════════════════════════════════════════════
//  Auto-save to localStorage
// ══════════════════════════════════════════════════

const LS_KEY = 'verdant-demo-builder-v1';
let _saveTimer = null;

function scheduleSave() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(saveToLocal, 800);
}

function saveToLocal() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    showSaveStatus('已自动保存 ✓');
  } catch (err) {
    showSaveStatus('⚠️ 保存失败（存储空间不足）');
  }
}

function loadFromLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    const saved = JSON.parse(raw);
    if (saved && Array.isArray(saved.plants) && saved.plants.length > 0) {
      state = saved;
      return true;
    }
  } catch (e) {}
  return false;
}

function clearLocal() {
  if (!confirm('确认清空所有已保存的数据？此操作不可撤销。')) return;
  localStorage.removeItem(LS_KEY);
  state = { plants: [], activePlantId: null };
  renderAll();
  toast('已清空所有数据');
}

function showSaveStatus(msg) {
  const el = document.getElementById('saveStatus');
  if (el) { el.textContent = msg; el.style.opacity = '1'; }
  clearTimeout(showSaveStatus._t);
  showSaveStatus._t = setTimeout(() => { if (el) el.style.opacity = '0'; }, 3000);
}

// Patch renderAll to also trigger save
const _origRenderAll = renderAll;
function renderAll() {
  _origRenderAll();
  scheduleSave();
}

// ══════════════════════════════════════════════════
//  Init
// ══════════════════════════════════════════════════

const hadSavedData = loadFromLocal();
renderAll();
if (hadSavedData) {
  setTimeout(() => toast(`✅ 已恢复上次进度：${state.plants.length} 株植物`), 300);
}
</script>
